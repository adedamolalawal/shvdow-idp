apiVersion: v1
kind: Secret
metadata:
  name: service-catalog-secrets
  namespace: shadow-idp
  labels:
    app.kubernetes.io/name: service-catalog
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: shadow-idp
type: Opaque
data:
  # Base64 encoded values - replace with your actual values
  # To encode: echo -n "your-value" | base64
  
  # Database credentials
  DB_USER: c2VydmljZV9jYXRhbG9n  # service_catalog
  DB_PASSWORD: Y2F0YWxvZ19wYXNzd29yZA==  # catalog_password
  
  # JWT secret for authentication (if needed)
  JWT_SECRET: eW91ci1qd3Qtc2VjcmV0LWtleS1oZXJl  # your-jwt-secret-key-here
  
  # Redis password (if Redis auth is enabled)
  REDIS_PASSWORD: cmVkaXNfcGFzc3dvcmQ=  # redis_password
  
  # API keys for external integrations (optional)
  PROMETHEUS_API_KEY: cHJvbWV0aGV1c19hcGlfa2V5  # prometheus_api_key
  GRAFANA_API_KEY: Z3JhZmFuYV9hcGlfa2V5  # grafana_api_key

---
# Database secret for PostgreSQL
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: shadow-idp
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: shadow-idp
type: Opaque
data:
  # PostgreSQL credentials
  POSTGRES_DB: c2VydmljZV9jYXRhbG9n  # service_catalog
  POSTGRES_USER: c2VydmljZV9jYXRhbG9n  # service_catalog
  POSTGRES_PASSWORD: Y2F0YWxvZ19wYXNzd29yZA==  # catalog_password
