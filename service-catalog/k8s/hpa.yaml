apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: service-catalog-hpa
  namespace: shadow-idp
  labels:
    app.kubernetes.io/name: service-catalog
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: shadow-idp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: service-catalog
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: service-catalog-pdb
  namespace: shadow-idp
  labels:
    app.kubernetes.io/name: service-catalog
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: shadow-idp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: service-catalog
      app.kubernetes.io/component: backend
