apiVersion: v1
kind: Service
metadata:
  name: service-catalog-service
  namespace: shadow-idp
  labels:
    app.kubernetes.io/name: service-catalog
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: shadow-idp
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8081"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8081
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: service-catalog
    app.kubernetes.io/component: backend

---
# Headless service for StatefulSet (if needed for clustering)
apiVersion: v1
kind: Service
metadata:
  name: service-catalog-headless
  namespace: shadow-idp
  labels:
    app.kubernetes.io/name: service-catalog
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: shadow-idp
spec:
  clusterIP: None
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: service-catalog
    app.kubernetes.io/component: backend
