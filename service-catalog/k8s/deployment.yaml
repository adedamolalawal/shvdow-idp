apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-catalog
  namespace: shadow-idp
  labels:
    app.kubernetes.io/name: service-catalog
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: shadow-idp
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: service-catalog
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-catalog
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: shadow-idp
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: service-catalog-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: service-catalog
        image: shadow-idp/service-catalog:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
          name: http
          protocol: TCP
        env:
        # Configuration from ConfigMap
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: service-catalog-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: service-catalog-config
              key: PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: service-catalog-config
              key: LOG_LEVEL
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: service-catalog-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: service-catalog-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: service-catalog-config
              key: DB_NAME
        - name: API_PREFIX
          valueFrom:
            configMapKeyRef:
              name: service-catalog-config
              key: API_PREFIX
        - name: CORS_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: service-catalog-config
              key: CORS_ORIGIN
        - name: ENABLE_METRICS
          valueFrom:
            configMapKeyRef:
              name: service-catalog-config
              key: ENABLE_METRICS
        - name: ENABLE_TEMPLATES
          valueFrom:
            configMapKeyRef:
              name: service-catalog-config
              key: ENABLE_TEMPLATES
        - name: ENABLE_DEPENDENCIES
          valueFrom:
            configMapKeyRef:
              name: service-catalog-config
              key: ENABLE_DEPENDENCIES
        - name: ENABLE_DASHBOARD
          valueFrom:
            configMapKeyRef:
              name: service-catalog-config
              key: ENABLE_DASHBOARD
        # Secrets
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: service-catalog-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: service-catalog-secrets
              key: DB_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: service-catalog-secrets
              key: JWT_SECRET
              optional: true
        # Health check endpoints
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        # Resource limits and requests
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        # Volume mounts for temporary files
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      # Pod disruption budget for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - service-catalog
              topologyKey: kubernetes.io/hostname
