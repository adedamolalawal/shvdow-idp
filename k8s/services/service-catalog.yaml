apiVersion: v1
kind: Service
metadata:
  name: service-catalog
  namespace: shadow-idp
  labels:
    app: service-catalog
    component: backend
    app.kubernetes.io/name: service-catalog
    app.kubernetes.io/part-of: shadow-idp-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8081"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8081
    targetPort: http
    protocol: TCP
  selector:
    app: service-catalog
