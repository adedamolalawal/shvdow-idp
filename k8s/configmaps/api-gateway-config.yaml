apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: shadow-idp
  labels:
    app: api-gateway
    component: gateway
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: shadow-idp-platform
data:
  log-level: "info"
  cors-origin: "*"
  rate-limit-window: "900000"  # 15 minutes in milliseconds
  rate-limit-max: "100"
  jwt-expiry: "24h"
  config.json: |
    {
      "server": {
        "port": 8080,
        "cors": {
          "origin": "*",
          "credentials": true
        }
      },
      "auth": {
        "jwt": {
          "expiresIn": "24h",
          "algorithm": "HS256"
        }
      },
      "rateLimit": {
        "windowMs": 900000,
        "max": 100,
        "message": "Too many requests from this IP"
      },
      "proxy": {
        "timeout": 30000,
        "retries": 3
      },
      "services": {
        "serviceCatalog": {
          "url": "http://service-catalog:8081",
          "timeout": 10000
        }
      }
    }
