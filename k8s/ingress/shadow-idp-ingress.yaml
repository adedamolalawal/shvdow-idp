apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shadow-idp-ingress
  namespace: shadow-idp
  labels:
    app.kubernetes.io/name: shadow-idp
    app.kubernetes.io/part-of: shadow-idp-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  rules:
  - host: shadow-idp.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
---
# Direct access to services for development/debugging
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shadow-idp-services-ingress
  namespace: shadow-idp
  labels:
    app.kubernetes.io/name: shadow-idp
    app.kubernetes.io/part-of: shadow-idp-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: api-gateway.shadow-idp.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
  - host: service-catalog.shadow-idp.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: service-catalog
            port:
              number: 8081
