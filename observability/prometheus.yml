global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'gitops-core'
    static_configs:
      - targets: ['gitops-core:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'cicd-engine'
    static_configs:
      - targets: ['cicd-engine:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'service-catalog'
    static_configs:
      - targets: ['service-catalog:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'metrics-collector'
    static_configs:
      - targets: ['metrics-collector:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'alert-engine'
    static_configs:
      - targets: ['alert-engine:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'team-management'
    static_configs:
      - targets: ['team-management:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'docs-engine'
    static_configs:
      - targets: ['docs-engine:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

